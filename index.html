<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/style.css">
    <script defer src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script defer src="assets/script.js"></script>
</head>

<body>
    <nav class="navbar navbar-light bg-light shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">
                <img class="img-fluid rounded-circle" src="assets/images/image.png" alt="Library Logo">
                <span>Kuthbukhana Anwariyya</span>
            </a>
            <button class="btn btn-outline-danger btn-sm fw-bold btn-close-library-toggle shadow-sm" onclick="toggleCloseLibrary()">
                <i class="bi bi-lock-fill me-1"></i> Close Library
            </button>
        </div>
    </nav>

    <div class="heroimageBox">
        <span class="gragient-box"></span>
        <div class="elements">
            <div class="textandlogo">
                <img class="img-fluid" src="assets/images/image.png" alt="Library Logo">
            </div>
            <div class="text">
                <h1 class="fw-bold">Kuthbukhana Anwariyya</h1>
            </div>
            <div class="buttons d-flex gap-2 flex-wrap justify-content-center">
                <button class="btn btn-primary" onclick="openlibrary()"><i class="bi bi-book"></i> Open Library</button>
                <button class="check btn btn-success" onclick="checkledger()"><i class="bi bi-journal-text"></i> Check
                    Ledger</button>
                <!-- <button class="btn btn-info text-white" onclick="goprincipal()"><i class="bi bi-person-badge"></i> Principal View</button>
                <button class="btn btn-danger" onclick="goadmin()"><i class="bi bi-speedometer2"></i> Admin Panel</button> -->
            </div>

        </div>
    </div>
</body>
