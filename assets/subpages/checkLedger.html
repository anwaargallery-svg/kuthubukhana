<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Ledger - Kuthbukhana Anwariyya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../style.css">
    <script defer src="https://code.jquery.com/jquery-4.0.0.js"
        integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script defer src="../script.js"></script>
</head>

<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../../index.html" onclick="gohome(); return false;">
                <img class="img-fluid rounded-circle" src="../images/image.png" alt="Library Logo">
                <span>Kuthbukhana Anwariyya</span>
            </a>
            <div class="d-flex gap-2 flex-wrap align-items-center">
                <button class="btn btn-outline-secondary" onclick="gohome()"><i class="bi bi-house-door me-1"></i> Home</button>
                <button class="btn btn-outline-primary" onclick="openlibrary()"><i class="bi bi-book me-1"></i> Open Library</button>
                <button class="btn btn-success active" onclick="checkledger()"><i class="bi bi-journal-text me-1"></i> Check Ledger</button>
                <button class="btn btn-outline-danger btn-sm fw-bold btn-close-library-toggle shadow-sm" onclick="toggleCloseLibrary()"><i class="bi bi-lock-fill me-1"></i> Close Library</button>
            </div>
        </div>
    </nav>

    <!-- Content Container -->
    <div class="container py-5">
        <div class="card shadow border-0 rounded-3">
            <div
                class="card-header bg-success text-white p-4 rounded-top d-flex justify-content-between align-items-center flex-wrap gap-3">
                <h2 class="h4 mb-0 fw-bold"><i class="bi bi-journal-text me-2"></i>Library Ledger & Inventory Records
                </h2>
                <button class="btn btn-light text-dark fw-semibold" onclick="gohome()">
                    <i class="bi bi-arrow-left me-1"></i> Back to Main
                </button>
            </div>
            <div class="card-body p-4">
                <!-- Search & Filter Controls -->
                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                            <input type="text" id="ledgerSearch" class="form-control"
                                placeholder="Search by student, roll no, or book..."
                                oninput="renderLedgerTable()">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select id="ledgerClassFilter" class="form-select" onchange="renderLedgerTable()">
                            <option value="all">🎓 All Classes & Divisions</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select id="ledgerFilter" class="form-select" onchange="renderLedgerTable()">
                            <option value="all">All Status Records</option>
                            <option value="issued">Currently Issued (Out of Stock)</option>
                            <option value="overdue">⚠️ Overdue Books (Fine Due)</option>
                            <option value="staff">📋 Staff Use Books (Issued to Staff)</option>
                            <option value="returned">Returned (In Stock)</option>
                        </select>
                    </div>
                    <div class="col-md-2 text-end">
                        <button class="btn btn-success w-100 fw-semibold"
                            onclick="openCustomExportModal()">
                            <i class="bi bi-file-earmark-arrow-down me-1"></i> Export Data
                        </button>
                    </div>
                </div>

                <!-- Ledger Records Table -->
                <div class="table-responsive">
                    <table class="table table-bordered table-hover align-middle border">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Roll No</th>
                                <th>Student Name</th>
                                <th>Book ID</th>
                                <th>Book Title</th>
                                <th>Issue Date</th>
                                <th>Due Date (Working Days)</th>
                                <th>Stock & Fine Status</th>
                            </tr>
                        </thead>
                        <tbody id="ledgerTableBody">
                            <!-- Populated dynamically via script.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    </div>

    <!-- Custom Data Export Modal -->
    <div class="modal fade" id="customDataExportModal" tabindex="-1" aria-labelledby="customDataExportModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-4 shadow-lg border-0">
                <div class="modal-header bg-success text-white p-3">
                    <h5 class="modal-title fw-bold d-flex align-items-center gap-2" id="customDataExportModalLabel">
                        <i class="bi bi-file-earmark-arrow-down fs-4"></i> Custom Library Data Export Engine
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4 bg-light">
                    
                    <!-- Data Scope Selection -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-dark"><i class="bi bi-database me-1 text-primary"></i> Data Scope to Export</label>
                            <select id="customExportScope" class="form-select fw-semibold">
                                <option value="all_books">📚 All Library Books (Full Catalog)</option>
                                <option value="instock">✅ In Stock Books Only (Available in Library)</option>
                                <option value="out_of_stock">⚠️ Out of Stock Books Only (Currently Issued)</option>
                                <option value="overdue_fines">💰 Overdue Books & Fine Details (Fines Due)</option>
                                <option value="full_ledger" selected>📋 Full Circulation Ledger Transactions</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold text-dark"><i class="bi bi-filetype-pdf me-1 text-danger"></i> Export File Format</label>
                            <select id="customExportFormat" class="form-select fw-semibold">
                                <option value="csv">📊 Excel CSV File (.csv)</option>
                                <option value="pdf">📄 Printable PDF Document / Report (.pdf)</option>
                                <option value="json">📋 JSON Raw Data File (.json)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Select Fields to Include in Export -->
                    <div class="card border rounded-4 shadow-sm mb-4">
                        <div class="card-header bg-white fw-bold d-flex align-items-center justify-content-between py-2.5">
                            <span><i class="bi bi-check2-square text-success me-1"></i> Select Fields / Columns to Include</span>
                            <div class="btn-group btn-group-sm">
                                <button type="button" class="btn btn-outline-primary py-0 px-2" onclick="toggleAllExportFields(true)" style="font-size: 0.78rem;">Select All</button>
                                <button type="button" class="btn btn-outline-secondary py-0 px-2" onclick="toggleAllExportFields(false)" style="font-size: 0.78rem;">Deselect All</button>
                            </div>
                        </div>
                        <div class="card-body p-3">
                            <div class="row g-3">
                                <div class="col-md-4 col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input custom-export-field" type="checkbox" id="chkBookName" value="title" checked>
                                        <label class="form-check-label fw-semibold" for="chkBookName"><i class="bi bi-book me-1 text-primary"></i> Book Name (Title)</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input custom-export-field" type="checkbox" id="chkAuthorName" value="author" checked>
                                        <label class="form-check-label fw-semibold" for="chkAuthorName"><i class="bi bi-person me-1 text-info"></i> Author Name</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input custom-export-field" type="checkbox" id="chkBarcode" value="barcode" checked>
                                        <label class="form-check-label fw-semibold" for="chkBarcode"><i class="bi bi-upc-scan me-1 text-dark"></i> Barcode / Book ID</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input custom-export-field" type="checkbox" id="chkInStock" value="instock" checked>
                                        <label class="form-check-label fw-semibold" for="chkInStock"><i class="bi bi-box-seam me-1 text-success"></i> In Stock Status</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input custom-export-field" type="checkbox" id="chkOutOfStock" value="outofstock" checked>
                                        <label class="form-check-label fw-semibold" for="chkOutOfStock"><i class="bi bi-exclamation-square me-1 text-warning"></i> Out of Stock Details</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input custom-export-field" type="checkbox" id="chkFineDetails" value="fine" checked>
                                        <label class="form-check-label fw-semibold" for="chkFineDetails"><i class="bi bi-currency-rupee me-1 text-danger"></i> Fine Details (Overdue ₹)</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input custom-export-field" type="checkbox" id="chkSection" value="section" checked>
                                        <label class="form-check-label fw-semibold" for="chkSection"><i class="bi bi-tag me-1 text-secondary"></i> Category / Section</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input custom-export-field" type="checkbox" id="chkBorrower" value="borrower" checked>
                                        <label class="form-check-label fw-semibold" for="chkBorrower"><i class="bi bi-person-badge me-1 text-primary"></i> Borrower Student / Staff</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check form-switch">
                                        <input class="form-check-input custom-export-field" type="checkbox" id="chkIssueDate" value="issueDate" checked>
                                        <label class="form-check-label fw-semibold" for="chkIssueDate"><i class="bi bi-calendar-event me-1 text-info"></i> Issue & Due Dates</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Secondary Filters -->
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-muted">Filter by Class / Division</label>
                            <select id="customExportClassFilter" class="form-select form-select-sm">
                                <option value="all">🎓 All Classes & Divisions</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-muted">Filter by Category / Section</label>
                            <select id="customExportCategoryFilter" class="form-select form-select-sm">
                                <option value="all">All Category Sections</option>
                            </select>
                        </div>
                    </div>

                </div>
                <div class="modal-footer bg-light p-3">
                    <button type="button" class="btn btn-secondary fw-bold px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success fw-bold px-4 shadow-sm" onclick="generateCustomExportData()">
                        <i class="bi bi-file-earmark-arrow-down me-1"></i> Export Custom Data
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
